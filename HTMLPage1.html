
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMNA People - HR System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 850px;
            margin: auto;
            padding: 25px;
            background: #f4f6fa;
            color: #222;
        }

        header, section {
            background: white;
            padding: 22px;
            margin-bottom: 20px;
            border-radius: 12px;
        }

        h1 {
            color: #2457a7;
        }

        .badge {
            padding: 7px 14px;
            border-radius: 20px;
            background: #ddd;
        }

        .on {
            background: #c9f5d5;
        }

        .off {
            background: #ffdada;
        }

        #msgs {
            min-height: 130px;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        input, button {
            padding: 12px;
            border-radius: 7px;
            border: 1px solid #ccc;
        }

        input {
            width: 65%;
        }

        button {
            background: #2457a7;
            color: white;
            cursor: pointer;
        }

        a {
            color: #2457a7;
        }

        .me {
            text-align: right;
            margin: 10px;
        }

        .bot {
            margin: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <header>
        <h1>OMNA People</h1>
        <p>Smart HR Automation System powered by n8n and AI.</p>
        <span id="status" class="badge">Checking...</span>
    </header>

    <section>
        <h2>Ask HR</h2>
        <div id="msgs"></div>

        <form id="ask">
            <input id="q" placeholder="Ask about HR policies..." required>
            <button type="submit">Send</button>
        </form>
    </section>

    <section>
        <h2>Our Services</h2>
        <p><a id="applyLink" target="_blank">Apply for a Job</a></p>
        <p><a id="coachLink" target="_blank">Get Coaching Report</a></p>
    </section>

    <section>
        <h2>How It Works</h2>
        <ul>
            <li>AI Recruitment Screening</li>
            <li>CV Analysis</li>
            <li>HR Policy Assistant</li>
            <li>Automated Email Notifications</li>
            <li>Error Monitoring</li>
        </ul>
    </section>

    <script>
        const CONFIG = {
        n8nBase: "https://sublevel-drift-walk.ngrok-free.dev",
        chat: "https://sublevel-drift-walk.ngrok-free.dev/workflow/HLjX0C9ipLtYSyU3/dacae2",
        applyForm: "https://sublevel-drift-walk.ngrok-free.dev/form-test/62d3eeea-7edb-4550-a4b9-0cb2bfd664f9,
        coachForm: "https://sublevel-drift-walk.ngrok-free.dev/workflow/HLjX0C9ipLtYSyU3/dacae2"
        };

        const $ = s => document.querySelector(s);
        const sessionId = crypto.randomUUID();

        const HEADERS = {
        "Content-Type": "application/json",
        "ngrok-skip-browser-warning": "1"
        };

        $("#applyLink").href = CONFIG.n8nBase + CONFIG.applyForm;
        $("#coachLink").href = CONFIG.n8nBase + CONFIG.coachForm;

        function setStatus(online) {
        $("#status").textContent = online ? "Online" : "Offline";
        $("#status").className = "badge " + (online ? "on" : "off");
        }

        async function checkStatus() {
        try {
        await fetch(CONFIG.n8nBase + CONFIG.chat, {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({
        action: "loadPreviousSession",
        sessionId
        })
        });
        setStatus(true);
        } catch (err) {
        setStatus(false);
        }
        }

        function add(cls, text) {
        const d = document.createElement("div");
        d.className = cls;
        d.textContent = text;
        $("#msgs").append(d);
        return d;
        }

        checkStatus();

        $("#ask").onsubmit = async e => {
        e.preventDefault();

        const q = $("#q").value.trim();
        if (!q) return;

        $("#q").value = "";
        add("me", q);

        const bot = add("bot", "Loading...");

        try {
        const r = await fetch(CONFIG.n8nBase + CONFIG.chat, {
        method: "POST",
        headers: HEADERS,
        body: JSON.stringify({
        action: "sendMessage",
        sessionId,
        chatInput: q
        })
        });

        if (!r.ok) throw new Error("Request failed");

        const data = await r.json();
        bot.textContent = data.output || "No answer received.";
        setStatus(true);

        } catch (err) {
        bot.textContent = "HR Assistant is offline. Try again later.";
        setStatus(false);
        }
        };
    </script>

</body>
</html>
